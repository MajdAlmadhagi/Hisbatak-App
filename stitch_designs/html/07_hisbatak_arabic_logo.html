<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background App Icon Shape -->
  <rect width="500" height="500" rx="115" fill="url(#bgGrad)"/>

  <!-- Inner Ambient Glow / Border -->
  <rect x="15" y="15" width="470" height="470" rx="100" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Geometric Modern Split Wallet Icon -->
  <g transform="translate(150, 85)" filter="url(#shadow)">
    <!-- Base Wallet Frame -->
    <rect x="15" y="25" width="170" height="120" rx="28" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Dividing Flow Line (representing Split / Accounting) -->
    <path d="M 15 70 Q 100 85 185 70" fill="none" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Split nodes representing group sharing -->
    <circle cx="55" cy="18" r="14" fill="url(#accentGrad)" stroke="#0F172A" stroke-width="4"/>
    <circle cx="145" cy="18" r="14" fill="url(#coralGrad)" stroke="#0F172A" stroke-width="4"/>
    
    <!-- Wallet Clasp / Shield Badge -->
    <rect x="140" y="65" width="52" height="40" rx="14" fill="#FFFFFF"/>
    <circle cx="166" cy="85" r="7" fill="#0F172A"/>
  </g>

  <!-- Arabic Brand Typography: حِسبَتك -->
  <text x="250" y="325" font-family="'IBM Plex Sans Arabic', 'Tajawal', sans-serif" font-size="68" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    حِسبَتك
  </text>

  <!-- English Subtitle / Tagline -->
  <text x="250" y="380" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="4">
    HISBATAK
  </text>
  
  <text x="250" y="420" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="16" font-weight="500" fill="#94A3B8" text-anchor="middle">
    المحفظة الذكية • دون إنترنت
  </text>
</svg>
